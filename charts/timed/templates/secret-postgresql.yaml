{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "timed.postgresql.fullname" . }}
  labels:
    {{- include "timed.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
data:
  password: {{ required "postgresql.auth.password is required when postgresql.enabled is true" .Values.postgresql.auth.password | b64enc | quote }}
{{- end }}
